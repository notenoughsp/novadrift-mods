; Nova Drift mod loader settings.
; Re-read at every run start, so you can edit it while the game is running.
; Comments start with ; or #

[settings]
; New gear profile: scorpion (built in) or novadrift_profiles\<name>.ini; empty = off
profile=scorpion

; 1 = always block leaderboard uploads (recommended)
; 0 = only block while values below are modded
block_leaderboards=1

; 1 = log gear and base stats at every run start (novadrift_mods.log in the game folder)
dump=0

; [vars]: tuning variables for all runs, see variables.txt
[vars]
; Examples (remove the semicolon to enable):
;assaultBaseHull=150        ; Assault body hull (default 90)
;assaultBaseThrust=140      ; Assault body thrust (default 110)
;swordsBaseDamage=200       ; Swords weapon damage (default 150)
;pulseSecondaryProjectiles=20

; [weapon.Name] / [body.Name] / [shield.Name]: base stats of a gear piece,
; only applied while it is equipped. The log shows the names at run start, e.g.
;   Gear: [body.Assault] (2)  [weapon.Railgun] (640)  [shield.Halo] (2)
;
; Weapons: Blaster, SplitShot, Flak, Railgun, Grenade, Salvo, Vortex, Pulse,
;          Torrent, Blade, Dart, ThermalLance, Swords
; Bodies:  Standard, Assault, Hullbreaker, Spectre, Firefly, Sentinel, Engineer,
;          Research, Battery, Architect, Viper, Carrier, Courser, Leviathan
; Shields: Standard, Halo, Reflect, Bastion, Temporal, Amp, Warp, Orbital,
;          Siphon, Shockwave
;[weapon.Blaster]
;weaponSetDamage=40
;weaponBaseFireTime=7        ; frames between shots, lower = faster
;weaponSetProjectiles=3
;weaponSetVelocity=30

;[body.Standard]
;bodySetHull=200
;bodySetHullMax=200

;[shield.Standard]
;shieldSetShieldMax=150
;shieldSetShieldCool=300     ; frames (60 = 1 second)
