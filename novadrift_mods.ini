; ============================================================
;  Nova Drift Mod-Loader - Einstellungen
; ============================================================
; Die Datei wird bei jedem Run-Start neu eingelesen. Du kannst sie also
; bei laufendem Spiel aendern und einfach einen neuen Run starten.
;
; Kommentare beginnen mit ; oder #

[settings]
; 1 = Bestenlisten immer sperren, auch ohne geaenderte Werte (empfohlen)
; 0 = nur sperren, solange unten Werte aktiv sind
; Das Spiel laedt dann am Run-Ende keinen Score zu Steam hoch.
block_leaderboards=1

; 1 = schreibt bei jedem Run-Start Ausruestung und Grundwerte ins Log
;     (novadrift_mods.log im Spielordner).
dump=0

; ------------------------------------------------------------
; [vars] - Balancing-Variablen (siehe variablen_liste.txt)
; Gilt fuer alle Runs.
; ------------------------------------------------------------
[vars]
; Beispiele (Semikolon entfernen zum Aktivieren):
;assaultBaseHull=150        ; Assault-Body: Huelle (Standard 90)
;assaultBaseThrust=140      ; Assault-Body: Schub (Standard 110)
;fireflyThrusterBurnDamage=2000
;swordsBaseDamage=200       ; Swords-Waffe: Grundschaden (Standard 150)
;pulseSecondaryProjectiles=20

; ------------------------------------------------------------
; [weapon.Name] / [body.Name] / [shield.Name] - Grundwerte der Ausruestung
; Gilt nur, wenn diese Ausruestung gewaehlt ist. Die Namen stehen nach
; dem Run-Start im Log, z. B.:
;   Ausruestung: [body.Assault] (2)  [weapon.Railgun] (757)  [shield.Halo] (2)
; Die aktuellen Grundwerte stehen mit dump=1 direkt darunter.
;
; Waffen:  Blaster, SplitShot, Flak, Railgun, Grenade, Salvo, Vortex, Pulse,
;          Torrent, Blade, Dart, ThermalLance, Swords
; Bodies:  Standard, Assault, Hullbreaker, Spectre, Firefly, Sentinel, Engineer,
;          Research, Battery, Architect, Viper, Carrier, Courser, Leviathan
; Schilde: Standard, Halo, Reflect, Bastion, Temporal, Amp, Warp, Orbital,
;          Siphon, Shockwave
; ------------------------------------------------------------
;[weapon.Blaster]
;weaponSetDamage=40          ; Grundschaden
;weaponBaseFireTime=7        ; Frames zwischen Schuessen, kleiner = schneller
;weaponSetProjectiles=3
;weaponSetVelocity=30

;[body.Standard]
;bodySetHull=200
;bodySetHullMax=200

;[shield.Standard]
;shieldSetShieldMax=150
;shieldSetShieldCool=300     ; in Frames (60 = 1 Sekunde)
