; Profile SKORPION: new body + new weapon
; Body: armored hunter, homing projectiles, but less damage.

[newbody]
name=Skorpion
skin=Skorpion                         ; row in custom_skins.csv
icon=custom_skins/skorpion_icon.png   ; hex icon 268x308
title.de=FORM: SKORPION
title.en=BODY: SCORPION
short.de=Ein gepanzerter Jäger, dessen Giftstachel jede Waffe zielsuchend machen.
short.en=An armored hunter whose venom stingers make any weapon home in on targets.
full.de=[$=rgb(84,184,255)][$=*]Deine Projektile suchen ihr Ziel\n[$=*]+15 % Hülle gegenüber der Standardform[$=/]\n\n[$=*]-15 % Gesamtschaden der Waffe\n[$=*]-10 % maximale Schilde\n[$=*]+8 % Schiffsgröße\n\n[$=*]Hülle: 115\nAntrieb: 90
full.en=[$=rgb(84,184,255)][$=*]Your projectiles seek their targets\n[$=*]+15% hull compared to the standard form[$=/]\n\n[$=*]-15% total weapon damage\n[$=*]-10% maximum shields\n[$=*]+8% ship size\n\n[$=*]Hull: 115\nThrust: 90

; Weapon STACHELSCHWANZ (stinger tail): weak twin gun forward (Blaster mechanics),
; automatic tail lash against pursuers behind (loader code, whip_*).

[newweapon]
name=Stachelschwanz
base=Blaster                               ; forward mechanics
icon=custom_skins/stachelschwanz_icon.png
whip_sprite=custom_skins/stachelschwanz_whip.png  ; 16 frames of 220x130
whip_anim_frames=16
whip_mask_tolerance=20                     ; lower = larger hitbox
whip_origin_x=12
whip_origin_y=65
whip_scale=1.5
whip_color=shield                          ; shield color or RRGGBB
whip_damage=6                              ; per frame of contact
whip_frames=20                             ; lash duration (60 = 1 s)
whip_swing=90                              ; swing arc in degrees
whip_cooldown=50                           ; frames between lashes
whip_range=260                             ; reach behind the ship
whip_angle=70                              ; half cone behind the ship
shot=custom_skins/stachelschwanz_shot.png  ; projectile sprite (201x80)
shot_origin_x=160
shot_origin_y=40
shot_color=shield
title.de=WAFFE: STACHELSCHWANZ
title.en=WEAPON: STINGER TAIL
short.de=Ein schwacher Doppellauf nach vorne. Der Schwanz sticht automatisch nach Verfolgern.
short.en=A weak twin gun up front. The tail automatically strikes anything chasing you.
full.de=[$=rgb(84,184,255)][$=*]Liegt ein Gegner hinter dir, peitscht der Schwanz in einem Bogen durch den Bereich hinter dem Schiff\n[$=*]Der Hieb trifft alles, was er berührt[$=/]\n\n[$=*]Nach vorne: Doppellauf mit wenig Schaden\n\n[$=*]Schaden vorne: 15 x 2, Feuerrate 6 /s\nSchwanzhieb: 6 Schaden pro Frame Kontakt\nHiebe: bis zu 1,2 /s, Reichweite 260
full.en=[$=rgb(84,184,255)][$=*]When an enemy is behind you, the tail lashes in an arc through the area behind your ship\n[$=*]The lash hits everything it touches[$=/]\n\n[$=*]Forward: a weak twin gun\n\n[$=*]Forward damage: 15 x 2, 6 shots /s\nTail lash: 6 damage per frame of contact\nLashes: up to 1.2 /s, range 260

[weapon.Stachelschwanz]
blasterBaseDamage=15        ; Blaster: 25

[body.Skorpion]
bodySetHull=115             ; Standard: 100
bodySetHullMax=115
bodySetAccell=0.27          ; thrust 90 (standard 0.3 = 100)
bodyMultShield=0.9
bodyMultShipSize=1.08
bodyMultDamage=0.85
weaponAddSeeking=1          ; homing projectiles
