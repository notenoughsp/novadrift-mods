; Profile SCORPION: new body + new weapon
; Body: armored hunter, homing projectiles, but less damage.
; In-game texts: title / short / full

[newbody]
name=Scorpion
skin=Scorpion                         ; row in custom_skins.csv
skin_row=Scorpion,scorpion.png,scorpion_force.png,scorpion_drone.png,180,45  ; added if missing
icon=custom_skins/scorpion_icon.png   ; hex icon 268x308
title=BODY: SCORPION
short=An armored hunter whose venom stingers make any weapon home in on targets.
full=[$=rgb(84,184,255)][$=*]Your projectiles seek their targets\n[$=*]+15% hull compared to the standard form[$=/]\n\n[$=*]-15% total weapon damage\n[$=*]-10% maximum shields\n[$=*]+8% ship size\n\n[$=*]Hull: 115\nThrust: 90

; Weapon STINGER TAIL: weak twin gun forward (Blaster mechanics),
; automatic tail lash against pursuers and projectiles behind (loader code, whip_*).

[newweapon]
name=Stinger
base=Blaster                               ; forward mechanics
icon=custom_skins/stinger_icon.png
whip_sprite=custom_skins/stinger_whip.png  ; 16 frames of 220x130
whip_anim_frames=16
whip_mask_tolerance=20                     ; lower = larger hitbox
whip_origin_x=12
whip_origin_y=65
whip_scale=1.5
whip_color=shield                          ; shield color or RRGGBB
whip_damage=6                              ; per frame of contact
whip_frames=20                             ; lash duration (60 = 1 s)
whip_swing=90                              ; swing arc in degrees
whip_cooldown=50                           ; frames between lashes
whip_range=260                             ; reach behind the ship
whip_angle=70                              ; half cone behind the ship
whip_block=1                               ; lash at projectiles behind and bat them back
shot=custom_skins/stinger_shot.png         ; projectile sprite (201x80)
shot_origin_x=160
shot_origin_y=40
shot_color=shield
title=WEAPON: STINGER TAIL
short=A weak twin gun up front. The tail automatically strikes anything chasing you.
full=[$=rgb(84,184,255)][$=*]When an enemy or projectile is behind you, the tail lashes in an arc through the area behind your ship\n[$=*]The lash hits everything it touches and bats enemy projectiles back at their shooter[$=/]\n\n[$=*]Forward: a weak twin gun\n\n[$=*]Forward damage: 15 x 2, 6 shots /s\nTail lash: 6 damage per frame of contact\nLashes: up to 1.2 /s, range 260

; Wild mod MOLTING (rare): below 30% hull the ship sheds its shell; the husk
; absorbs enemy projectiles for a few seconds, then the shell stays soft for a moment.

[molting]
name=Molting
base=mBravado                              ; rare wild mod whose upgrade info is reused
icon=custom_skins/molting_icon.png
molting_threshold=0.3                      ; hull fraction that triggers the molt
molting_cooldown=2700                      ; frames between molts (45 s)
molting_duration=240                       ; husk lifetime in frames (4 s)
molting_husk_scale=1.2                     ; husk size relative to the ship
molting_absorb_max=12                      ; projectiles a husk absorbs before it cracks
molting_absorb_bonus=0.08                  ; burst bonus per absorbed projectile (burst comes later)
molting_softshell=1.25                     ; damage taken multiplier right after molting
molting_softshell_time=180                 ; frames (3 s)
molting_force_offer=0                      ; 1 = also offer it in the common and very rare pools (testing)
title=WILD: MOLTING
short=Below 30% hull, shed your shell. The husk stays behind and absorbs enemy fire.
full=[$=rgb(84,184,255)][$=*]When your hull drops below 30%, you shed your shell\n[$=*]The husk stays behind for 4 seconds and absorbs up to 12 enemy projectiles[$=/]\n\n[$=*]Soft shell: you take 25% more damage for 3 seconds after molting\n\n[$=*]Cooldown: 45 seconds

[weapon.Stinger]
blasterBaseDamage=15        ; Blaster: 25

[body.Scorpion]
bodySetHull=115             ; Standard: 100
bodySetHullMax=115
bodySetAccell=0.27          ; thrust 90 (standard 0.3 = 100)
bodyMultShield=0.9
bodyMultShipSize=1.08
bodyMultDamage=0.85
weaponAddSeeking=1          ; homing projectiles
